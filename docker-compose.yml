services:
  nginx:
    image: nginx:1.27-alpine
    container_name: bio-graphrag-nginx
    # 8080 kept for local dev + CI health checks (wait_for_services.sh / make health).
    # Public access goes through the shared nginx-proxy on the `web` network
    # (server_name biograph.busybutlazy.com → this container:80).
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - default
      - web

  backend:
    build: ./backend
    # No longer exposed directly; nginx proxies to it.
    env_file:
      - .env
    depends_on:
      # Postgres must be *accepting connections*, not merely started: the FastAPI lifespan runs
      # ensure_schema before serving, so a Postgres that has not finished initialising kills the
      # app at boot and nginx answers 502 until something restarts it. Plain `depends_on` only
      # waits for the container, which made this a race the stack won by luck.
      postgres:
        condition: service_healthy
      # Neo4j and Qdrant are not touched at startup — /health reports "degraded" until they answer,
      # and scripts/wait_for_services.sh waits for "ok", so gating on them here would only add
      # Neo4j's slow boot to every start.
      neo4j:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./ingestion:/app/ingestion
      - ./schema:/app/schema
      - ./prompts:/app/prompts

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h/-p pin the check to the TCP listener: on first boot the entrypoint starts a temporary
      # unix-socket-only server to run initdb, and a socket-based pg_isready would report ready
      # while the port the backend dials is still closed.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:

networks:
  # Shared reverse-proxy network owned by /home/jett/docker/nginx (nginx-proxy).
  # Only nginx joins it; backend + datastores stay on the default network.
  web:
    external: true
    name: web
